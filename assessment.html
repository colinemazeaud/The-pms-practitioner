/* ---------------------------------------------------------
   HELPERS
--------------------------------------------------------- */

function computeResultState(answers) {
  const counts = { A: 0, B: 0, C: 0 };
  ["q1", "q2", "q3", "q5"].forEach((k) => {
    if (answers[k]) counts[answers[k].state] += 1;
  });
  const max = Math.max(counts.A, counts.B, counts.C);
  const tied = Object.keys(counts).filter((k) => counts[k] === max);
  if (tied.length === 1) return tied[0];
  const q2State = answers.q2 && answers.q2.state;
  if (q2State && tied.includes(q2State)) return q2State;
  return tied[0];
}

function validEmail(email) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}

function PMSAssessment() {
  // step: 'intro' | 0..5 (question index) | 'capture' | 'result' | 'registerForm' | 'sent'

  const [answers, setAnswers] = React.useState({});
  const [draftText, setDraftText] = React.useState("");
  const [name, setName] = React.useState("");
  const [email, setEmail] = React.useState("");
  const [consent, setConsent] = React.useState(false);
  const [formError, setFormError] = React.useState("");
  const [location, setLocation] = React.useState("");
  const [conditions, setConditions] = React.useState([]);
  const [regFormError, setRegFormError] = React.useState("");
  const [nextStep, setNextStep] = React.useState("call");
  const [registerConsent, setRegisterConsent] = React.useState(false);

  const allQuestions = [...SCORED_QUESTIONS, ...FREE_QUESTIONS];

  const goToStep = (n) => {
    if (typeof n === "number") {
      const q = allQuestions[n];
      if (q && q.placeholder) setDraftText(answers[q.id] || "");
    }
    setStep(n);
  };

  const handleStart = () => {
    setAnswers({});
    setDraftText("");
    setLocation("");
    setConditions([]);
    setRegFormError("");
    goToStep(0);
  };

  const handleSelectOption = (question, option) => {
    const updated = { ...answers, [question.id]: option };
    setAnswers(updated);
    const idx = allQuestions.findIndex((q) => q.id === question.id);
    setTimeout(() => goToStep(idx + 1 < allQuestions.length ? idx + 1 : "capture"), 220);
  };

  const handleFreeTextNext = (question) => {
    const updated = { ...answers, [question.id]: draftText.trim() };
    setAnswers(updated);
    const idx = allQuestions.findIndex((q) => q.id === question.id);
    setDraftText("");
    goToStep(idx + 1 < allQuestions.length ? idx + 1 : "capture");
  };

  const handleBack = () => {
    if (step === "capture") {
      goToStep(allQuestions.length - 1);
      return;
    }
    if (step === "registerForm") {
      setStep("result");
      return;
    }
    if (typeof step === "number" && step > 0) {
      goToStep(step - 1);
    } else if (step === 0) {
      setStep("intro");
    }
  };

  const handleSubmitCapture = (e) => {
    e.preventDefault();
    if (!name.trim()) {
      setFormError("Enter your first name.");
      return;
    }
    if (!validEmail(email)) {
      setFormError("Enter a valid email address.");
      return;
    }
    if (!consent) {
      setFormError("Please tick the box so I know it's okay to send your result.");
      return;
    }
    setFormError("");
    setStep("result");
  };

  const toggleCondition = (option) => {
    setConditions((prev) => {
      if (option === "Other") {
        return prev.includes("Other") ? [] : ["Other"];
      }
      const withoutOther = prev.filter((c) => c !== "Other");
      if (withoutOther.includes(option)) {
        return withoutOther.filter((c) => c !== option);
      }
      return [...withoutOther, option];
    });
  };

  const handleOpenRegisterForm = () => {
    setRegFormError("");
    setNextStep("call");
    setRegisterConsent(false);
    setStep("registerForm");
  };

  const buildRegistrationMailto = () => {
    const subject = "Registering my interest — The Rhythm Reset";
    const nextStepLine =
      nextStep === "call"
        ? "I'd like to book a free 10-minute call first."
        : "I'm ready to book the Rhythm Reset now.";
    const lines = [
      "Hi Coline,",
      "",
      "I've just done the free PMS assessment and I'd like to register my interest in the Rhythm Reset.",
      "",
      `Name: ${name}`,
      `Current location: ${location}`,
      `What I'm dealing with: ${conditions.join(", ")}`,
      "",
      nextStepLine,
      "",
    ];
    return `mailto:colinemazeaud@marellehealth.com?subject=${encodeURIComponent(
      subject
    )}&body=${encodeURIComponent(lines.join("\n"))}`;
  };

  const handleSendRegistration = () => {
    if (!name.trim()) {
      setRegFormError("Enter your first name.");
      return;
    }
    if (!location.trim()) {
      setRegFormError("Let me know your current location.");
      return;
    }

      setRegFormError("Choose at least one option.");
      return;
    }

      setRegFormError("Please tick the box to confirm you're happy to proceed.");
      return;
    }
    setRegFormError("");
    window.location.href = buildRegistrationMailto();
    setStep("sent");
  };

  const resultState = step === "result" || step === "registerForm" || step === "sent"
    ? computeResultState(answers)
    : null;
  const result = resultState ? RESULTS[resultState] : null;

    step === "intro"

      : step === "capture"

      </div>

      <div className="pms-header">
        <span className="pms-wordmark">The PMS Practitioner</span>
        <span className="pms-step-label">
          {step === "intro" && "Free Assessment"}
          {typeof step === "number" && `Question ${step + 1} of ${TOTAL_QUESTIONS}`}
          {step === "capture" && "Your Result"}
          {step === "result" && "Your Result"}
          {step === "registerForm" && "Register Interest"}
          {step === "sent" && "Register Interest"}
        </span>
      </div>

      <div className="pms-body">
        {/* INTRO */}
        {step === "intro" && (
          <>
            <p className="pms-eyebrow">Free Assessment</p>
            <h1 className="pms-h1">Let's find out where you're stuck.</h1>
            <p className="pms-lede">
              Just an honest look at what you've tried, what's been said to you, and
              what you're actually ready to change. Takes about two minutes.
            </p>
            <div className="pms-btn-row">
              <button className="pms-btn-primary" onClick={handleStart}>
                Start the assessment <span aria-hidden="true">&nbsp;&rarr;</span>
              </button>
            </div>
          </>
        )}

        {/* SCORED QUESTIONS */}
        {typeof step === "number" && step < SCORED_QUESTIONS.length && (
          <>
            <button className="pms-back" onClick={handleBack}>
              <span aria-hidden="true">&larr;&nbsp;</span> Back
            </button>
            <h2 className="pms-question-h">{SCORED_QUESTIONS[step].text}</h2>
            <div className="pms-options">
              {SCORED_QUESTIONS[step].options.map((opt) => {
                const isSelected =
                  answers[SCORED_QUESTIONS[step].id] &&
                  answers[SCORED_QUESTIONS[step].id].label === opt.label;
                return (
                  <button
                    key={opt.label}
                    className={`pms-option${isSelected ? " selected" : ""}`}
                    style={{
                      borderColor: isSelected ? "#7A241F" : "rgba(58, 24, 21, 0.14)",
                      backgroundColor: isSelected ? "#FCF3EF" : "#FBF8F2",
                    }}
                    onClick={() => handleSelectOption(SCORED_QUESTIONS[step], opt)}
                    aria-pressed={isSelected}
                  >
                    <span>{opt.label}</span>
                    <span className="pms-option-check">
                      {isSelected && <span aria-hidden="true">&#10003;</span>}
                    </span>
                  </button>
                );
              })}
            </div>
          </>
        )}

        {/* FREE TEXT QUESTIONS */}
        {typeof step === "number" &&
          step >= SCORED_QUESTIONS.length &&
          step < allQuestions.length && (
            (() => {
              const q = FREE_QUESTIONS[step - SCORED_QUESTIONS.length];
              return (
                <>
                  <button className="pms-back" onClick={handleBack}>
                    <span aria-hidden="true">&larr;&nbsp;</span> Back
                  </button>
                  <h2 className="pms-question-h">
                    {q.text} <span className="pms-optional-tag">(optional)</span>
                  </h2>
                  <textarea
                    className="pms-textarea"
                    placeholder={q.placeholder}
                    value={draftText}
                    onChange={(e) => setDraftText(e.target.value)}
                    autoFocus
                  />
                  <div className="pms-btn-row">
                    <button
                      className="pms-btn-primary"
                      onClick={() => handleFreeTextNext(q)}
                    >
                      Continue <span aria-hidden="true">&nbsp;&rarr;</span>
                    </button>
                  </div>
                </>
              );
            })()
          )}

        {/* CAPTURE */}
        {step === "capture" && (
          <>
            <button className="pms-back" onClick={handleBack}>
              <span aria-hidden="true">&larr;&nbsp;</span> Back
            </button>
            <p className="pms-eyebrow">Almost there</p>
            <h2 className="pms-question-h">Where should I send your result?</h2>
            <form onSubmit={handleSubmitCapture}>
              <div className="pms-form-field">
                <label className="pms-label" htmlFor="pms-name">First name</label>
                <input
                  id="pms-name"
                  className="pms-input"
                  type="text"
                  value={name}
                  onChange={(e) => setName(e.target.value)}
                  placeholder="Emma"
                />
              </div>
              <div className="pms-form-field">
                <label className="pms-label" htmlFor="pms-email">Email</label>
                <input
                  id="pms-email"
                  className="pms-input"
                  type="email"
                  value={email}
                  onChange={(e) => setEmail(e.target.value)}
                  placeholder="you@email.com"
                />
              </div>
              <div className="pms-consent-row">
                <input
                  id="pms-consent"
                  type="checkbox"
                  checked={consent}
                  onChange={(e) => setConsent(e.target.checked)}
                />
                <label className="pms-consent-text" htmlFor="pms-consent">
                  Send my result to my inbox, and add me to Coline's email list, where
                  she shares PMS insight most weeks. Unsubscribe any time.
                </label>
              </div>
              {formError && <p className="pms-form-error">{formError}</p>}
              <div className="pms-btn-row">
                <button className="pms-btn-primary" type="submit">
                  See your result <span aria-hidden="true">&nbsp;&rarr;</span>
                </button>
              </div>
            </form>
          </>
        )}

        {/* RESULT */}
        {step === "result" && result && (
          <>
            <p className="pms-eyebrow">{result.eyebrow}</p>
            <h1 className="pms-h1">{result.titleFn(name.trim())}</h1>
            <p className="pms-result-para">{result.paragraph}</p>

            <hr className="pms-divider" />
            <p className="pms-bridge">{BRIDGE_TEXT}</p>

            <p className="pms-next-step">So, what's your next step?</p>

            <div className="pms-cta-block">
              <p className="pms-cta-headline">{result.ctaHeadline}</p>
              <p className="pms-cta-sub">{result.ctaSub}</p>
              <button className="pms-btn-primary" type="button" onClick={handleOpenRegisterForm}>
                Register Your Interest <span aria-hidden="true">&nbsp;&rarr;</span>
              </button>
            </div>

            <div className="pms-secondary-wrap">
              <p className="pms-secondary-lead">Not sure this is the right fit yet?</p>
              <button className="pms-btn-outline" type="button">
                {SECONDARY_CTA}
              </button>
              <p className="pms-secondary-lead pms-secondary-note">to meet your nutritional therapist first</p>
            </div>

            <p className="pms-credentials">
              DipNT · ANP Registered · Trained at CNM · Menstrual Cycle Awareness Coach
            </p>

            <button className="pms-restart" onClick={() => {
              setAnswers({});
              setName("");
              setEmail("");
              setConsent(false);
              setLocation("");
              setConditions([]);
              setNextStep("call");
              setRegisterConsent(false);
                        setStep("intro");
            }}>
              Retake the assessment
            </button>
          </>
        )}

        {/* REGISTER INTEREST FORM */}
        {step === "registerForm" && result && (
          <>
            <button className="pms-back" onClick={handleBack}>
              <span aria-hidden="true">&larr;&nbsp;</span> Back
            </button>
            <p className="pms-eyebrow">The Rhythm Reset</p>
            <h2 className="pms-question-h">Register your interest</h2>
            <p className="pms-lede">
              A few quick details — this opens your email app with everything
              filled in, ready to send to Coline.
            </p>

            <div className="pms-form-field">
              <label className="pms-label" htmlFor="pms-reg-name">First name</label>
              <input
                id="pms-reg-name"
                className="pms-input"
                type="text"
                value={name}
                onChange={(e) => setName(e.target.value)}
                placeholder="Emma"
              />
            </div>

            <div className="pms-form-field">
              <label className="pms-label" htmlFor="pms-location">
                Current location (country)
              </label>
              <input
                id="pms-location"
                className="pms-input"
                type="text"
                value={location}
                onChange={(e) => setLocation(e.target.value)}
                placeholder="e.g. United Kingdom"
              />
            </div>

            <div className="pms-form-field">
              <label className="pms-label">What are you dealing with?</label>
              <p className="pms-field-hint" style={{ marginTop: -2 }}>Select all that apply.</p>
              <div className="pms-checkbox-list">
                {CONDITION_OPTIONS.map((option) => {
                  const isChecked = conditions.includes(option);
                  const inputId = `pms-condition-${option}`;
                  return (
                    <div className="pms-checkbox-item" key={option}>
                      <input
                        id={inputId}
                        type="checkbox"
                        checked={isChecked}
                        onChange={() => toggleCondition(option)}
                      />
                      <label htmlFor={inputId}>{option}</label>
                    </div>
                  );
                })}
              </div>
            </div>

            <div className="pms-form-field">
              <label className="pms-label">What would you like to do next?</label>
              <div className="pms-checkbox-list">
                <div className="pms-checkbox-item">
                  <input
                    id="pms-next-call"
                    type="radio"
                    name="pms-next-step"
                    checked={nextStep === "call"}
                    onChange={() => setNextStep("call")}
                  />
                  <label htmlFor="pms-next-call">Book a free 10-minute call first</label>
                </div>
                <div className="pms-checkbox-item">
                  <input
                    id="pms-next-book"
                    type="radio"
                    name="pms-next-step"
                    checked={nextStep === "book"}
                    onChange={() => setNextStep("book")}
                  />
                  <label htmlFor="pms-next-book">I'm ready to book the Rhythm Reset now</label>
                </div>
              </div>
            </div>

            <div className="pms-consent-row">
              <input
                id="pms-register-consent"
                type="checkbox"
                checked={registerConsent}
                onChange={(e) => setRegisterConsent(e.target.checked)}
              />
              <label className="pms-consent-text" htmlFor="pms-register-consent">
                I consent to Coline seeing and using the information above to
                assess whether her services are a good fit for me. See the{" "}
                <a
                  href={PRIVACY_POLICY_URL}
                  className="pms-privacy-link"
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  Privacy Policy
                </a>
                .
              </label>
            </div>

            {regFormError && <p className="pms-form-error">{regFormError}</p>}

            <div className="pms-btn-row">
              <button className="pms-btn-primary" type="button" onClick={handleSendRegistration}>
                Open email to Coline <span aria-hidden="true">&nbsp;&rarr;</span>
              </button>
            </div>
          </>
        )}

        {/* SENT CONFIRMATION */}
        {step === "sent" && (
          <>
            <p className="pms-eyebrow">Thank you, {name || "there"}</p>
            <h1 className="pms-h1">Your email should be open and ready to send.</h1>
            <p className="pms-lede">
              Your mail app should have opened with everything filled in — just
              hit send. If nothing opened, email{" "}
              <strong>colinemazeaud@marellehealth.com</strong> directly and
              mention you took the PMS assessment.
            </p>
            <button className="pms-restart" onClick={() => {
              setAnswers({});
              setName("");
              setEmail("");
              setConsent(false);
              setLocation("");
              setConditions([]);
              setNextStep("call");
              setRegisterConsent(false);
                        setStep("intro");
            }}>
              Retake the assessment
            </button>
          </>
        )}
      </div>
    </div>
  );
}

const rootEl = document.getElementById("root");
ReactDOM.createRoot(rootEl).render(<PMSAssessment />);
</script>
</body>
</html>
